<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover enables safe-area-inset for notched iOS devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Delight Kitchen Bistro & Cafe — family-run English & Turkish bistro on Ballards Lane, North Finchley. Halal kitchen, vegan-friendly, open 7am–5pm. Good food, great coffee, and an atmosphere you won't want to leave." />

    <!-- Theme colour for browser chrome (mobile) — black steel -->
    <meta name="theme-color" content="#1C1815" />
    <meta name="color-scheme" content="light" />

    <!-- Open Graph / social sharing -->
    <meta property="og:title" content="Delight Kitchen — English & Turkish Bistro, N12" />
    <meta property="og:description" content="There's a table with your name on it. Turkish eggs at seven, smashed avo at nine, shakshuka at noon — family-run on Ballards Lane, North Finchley, open 7 days from 7am." />
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:locale" content="en_GB" />

    <!-- Mobile web app capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Delight Kitchen" />

    <!-- Fonts: Cinzel (display), Cormorant Garamond (serif), Manrope (sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <title>Delight Kitchen — English &amp; Turkish bistro on Ballards Lane, N12</title>

    <!-- JSON-LD: Restaurant + LocalBusiness structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["Restaurant", "LocalBusiness"],
      "name": "Delight Kitchen Bistro & Cafe",
      "image": [],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "337 Ballards Lane",
        "addressLocality": "North Finchley",
        "addressRegion": "London",
        "postalCode": "N12 8LT",
        "addressCountry": "GB"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 51.6090,
        "longitude": -0.1857
      },
      "url": "https://delightkitchen.co.uk",
      "telephone": "+442081276766",
      "email": "hello@delightkitchen.co.uk",
      "servesCuisine": ["English", "Turkish", "Mediterranean"],
      "priceRange": "£10–£20",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "580",
        "bestRating": "5"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
          "opens": "07:00",
          "closes": "17:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": "Sunday",
          "opens": "08:00",
          "closes": "16:00"
        }
      ],
      "menu": "https://delightkitchen.co.uk/menu",
      "acceptsReservations": "False",
      "hasMenu": {
        "@type": "Menu",
        "name": "Main Menu",
        "description": "English & Turkish brunch, grill, pancakes, coffee"
      }
    }
    </script>

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

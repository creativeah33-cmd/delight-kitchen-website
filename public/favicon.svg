<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background: black steel circle -->
  <circle cx="32" cy="32" r="32" fill="#1C1815"/>
  
  <!-- Inner amber arch glow ring -->
  <path d="M16 44 C16 28 22 16 32 16 C42 16 48 28 48 44" 
        fill="none" stroke="#E39A3B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Fork (left) -->
  <g transform="translate(21, 18) rotate(0)" fill="none" stroke="#E6D9C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <line x1="5" y1="16" x2="5" y2="30"/>
    <!-- Tines -->
    <line x1="2" y1="10" x2="2" y2="18"/>
    <line x1="5" y1="10" x2="5" y2="18"/>
    <line x1="8" y1="10" x2="8" y2="18"/>
    <!-- Bridge -->
    <path d="M2 18 Q5 20 8 18"/>
  </g>
  
  <!-- Spoon (right) -->
  <g transform="translate(33, 18)" fill="none" stroke="#E6D9C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Handle -->
    <line x1="5" y1="18" x2="5" y2="30"/>
    <!-- Bowl -->
    <ellipse cx="5" cy="13" rx="5" ry="6"/>
  </g>
  
  <!-- Amber accent dot (the "delight" brand mark) -->
  <circle cx="32" cy="50" r="2.5" fill="#E39A3B"/>
</svg>

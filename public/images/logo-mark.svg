<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Arch shape (the niche) -->
  <path d="M8 42 V24 C8 13.5 16 6 24 6 C32 6 40 13.5 40 24 V42" 
        stroke="#1C1815" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- LED glow strip inside the arch -->
  <path d="M12 40 V26 C12 16.5 17 10 24 10 C31 10 36 16.5 36 26 V40" 
        stroke="#E39A3B" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
  
  <!-- Fork (left) -->
  <g stroke="#1C1815" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="20" x2="18" y2="36"/>
    <line x1="16" y1="18" x2="16" y2="23"/>
    <line x1="18" y1="18" x2="18" y2="23"/>
    <line x1="20" y1="18" x2="20" y2="23"/>
    <path d="M16 23 Q18 25 20 23"/>
  </g>
  
  <!-- Spoon (right) -->
  <g stroke="#1C1815" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="24" x2="30" y2="36"/>
    <ellipse cx="30" cy="20" rx="3.5" ry="4.5"/>
  </g>
  
  <!-- Amber dot -->
  <circle cx="24" cy="40" r="1.5" fill="#E39A3B"/>
</svg>
